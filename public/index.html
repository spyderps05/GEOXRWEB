<!DOCTYPE html>
<html>
<head>
    <title>WebXR WorldWind</title>
    <meta name="description" content="WebXR integration with NASA WorldWind using A-Frame.">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://files.worldwind.arc.nasa.gov/artifactory/web/0.9.0/worldwind.min.js"></script>
    <style>
        body { margin: 0; }
        #worldwind-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 1024px;
            height: 1024px;
            display: none; /* Hide the canvas initially */
        }
    </style>
</head>
<body>
    <canvas id="worldwind-canvas"></canvas>
    <a-scene>
        <a-assets>
            <canvas id="ww-canvas" width="1024" height="1024"></canvas>
        </a-assets>
        <a-sky color="#ECECEC"></a-sky>
        <a-entity>
            <a-sphere id="globe" position="0 1.6 -2" radius="1" material="src: #ww-canvas"></a-sphere>
        </a-entity>
        <a-entity camera look-controls wasd-controls="fly: true" position="0 1.6 0">
            <a-entity id="ui-panel" position="0 -0.5 -1">
                <a-box id="toggle-button" position="0 0 0" depth="0.05" height="0.1" width="0.3" color="blue"></a-box>
                <a-text value="Toggle Data" align="center" position="0 0 0.03"></a-text>
            </a-entity>
        </a-entity>
    </a-scene>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/scripts/main.js"></script>
</body>
</html>
